worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'corr=$http_x_correlation_id';

  access_log /var/log/nginx/access.log main;
  sendfile on;
  keepalive_timeout 65;

  # Security headers (spec section 26)
  map $sent_http_content_type $x_content_type_options {
    default "nosniff";
  }

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  upstream localwala_gateway {
    server api-gateway:4000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    server_tokens off;
    add_header X-Content-Type-Options $x_content_type_options always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    location /health {
      proxy_pass http://localwala_gateway;
      access_log off;
    }

    location / {
      limit_req zone=api_limit burst=40 nodelay;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
      proxy_set_header Connection "";

      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      proxy_pass http://localwala_gateway;
    }
  }
}
