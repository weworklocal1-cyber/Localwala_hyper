global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: localwala-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:4000']

  - job_name: localwala-services
    metrics_path: /metrics
    dns_sd_configs:
      - names: ['tasks']
        type: 'A'
        port: 9100
