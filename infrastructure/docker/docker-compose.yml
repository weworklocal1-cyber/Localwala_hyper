name: localwala

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: localwala
      POSTGRES_PASSWORD: localwala
      POSTGRES_DB: localwala
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U localwala']
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - '9092:9092'
    environment:
      KAFKA_CFG_NODE_ID: '0'
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s
      timeout: 10s
      retries: 10

  api-gateway:
    profiles: ['apps']
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: '@localwala/api-gateway'
        SERVICE_DIR: api-gateway
    environment:
      NODE_ENV: production
      PORT: '4000'
      LOG_LEVEL: info
      SERVICE_VERSION: 0.1.0
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      UPSTREAM_AUTH_SERVICE: http://auth-service:4101
      UPSTREAM_USER_SERVICE: http://user-service:4102
      UPSTREAM_GEOGRAPHY_SERVICE: http://geography-service:4103
      UPSTREAM_CONFIG_SERVICE: http://config-service:4104
      UPSTREAM_MEDIA_SERVICE: http://media-service:4105
      UPSTREAM_NOTIFICATION_SERVICE: http://notification-service:4106
      UPSTREAM_SEARCH_SERVICE: http://search-service:4107
      UPSTREAM_SUPPORT_SERVICE: http://support-service:4108
      UPSTREAM_CATALOG_SERVICE: http://catalog-service:4109
      UPSTREAM_INVENTORY_SERVICE: http://inventory-service:4110
      UPSTREAM_CART_SERVICE: http://cart-service:4111
      UPSTREAM_ORDER_SERVICE: http://order-service:4112
      UPSTREAM_PAYMENT_SERVICE: http://payment-service:4113
      UPSTREAM_WALLET_SERVICE: http://wallet-service:4114
      UPSTREAM_PROMOTION_SERVICE: http://promotion-service:4115
      UPSTREAM_SETTLEMENT_SERVICE: http://settlement-service:4116
      UPSTREAM_REFERRAL_SERVICE: http://referral-service:4117
      UPSTREAM_DELIVERY_SERVICE: http://delivery-service:4118
      UPSTREAM_DISPATCH_ENGINE: http://dispatch-engine:4119
      UPSTREAM_DRIVER_SERVICE: http://driver-service:4120
      UPSTREAM_TRACKING_SERVICE: http://tracking-service:4121
      UPSTREAM_FOOD_SERVICE: http://food-service:4122
      UPSTREAM_STORE_SERVICE: http://store-service:4123
      UPSTREAM_DAIRY_SERVICE: http://dairy-service:4124
      UPSTREAM_ZATKA_SERVICE: http://zatka-service:4125
      UPSTREAM_LOCAL_SERVICES_SERVICE: http://local-services-service:4126
      UPSTREAM_REALESTATE_SERVICE: http://realestate-service:4127
      UPSTREAM_ANALYTICS_SERVICE: http://analytics-service:4128
      UPSTREAM_AUDIT_SERVICE: http://audit-service:4129
    ports:
      - '4000:4000'
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

