services:
  # Development overrides for all services
  api-gateway:
    profiles: ['apps']
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.service
      args:
        SERVICE: '@localwala/api-gateway'
      target: dev
    environment:
      SERVICE_DIR: api-gateway
      NODE_ENV: development
      PORT: '4000'
      LOG_LEVEL: debug
      SERVICE_VERSION: 0.1.0
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
    ports:
      - '4000:4000'
    volumes:
      - ../../packages:/app/packages
      - ../../services/api-gateway:/app/services/api-gateway
      - ../../tsconfig.base.json:/app/tsconfig.base.json
      - ../../tsconfig.json:/app/tsconfig.json
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  auth-service:
